<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C5 | Centro de Comando</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-panel: #111827;
            --text-main: #E5E7EB;
            --text-muted: #9CA3AF;
            --accent: #3B82F6;
            --critical: #EF4444;
            --high: #F97316;
            --medium: #EAB308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--bg-panel);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1F2937;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--accent);
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.1);
            color: #10B981;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #10B981;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10B981;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        /* Layout */
        main {
            display: flex;
            flex: 1;
            height: calc(100vh - 70px);
        }

        #map-container {
            flex: 2;
            position: relative;
            border-right: 1px solid #1F2937;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #1F2937;
        }

        .leaflet-control-layers {
            background-color: #1F2937 !important;
            color: #E5E7EB !important;
            border: 1px solid #374151 !important;
        }

        .leaflet-control-layers-list label {
            color: #E5E7EB;
        }

        #feed {
            flex: 1;
            min-width: 350px;
            max-width: 450px;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 1rem;
            border-bottom: 1px solid #1F2937;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        #alerts-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* Tarjetas de Alerta (Ahora interactivas) */
        .alert-card {
            background-color: #1F2937;
            border-radius: 8px;
            padding: 1rem;
            border-left: 5px solid gray;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .alert-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.5);
            filter: brightness(1.2);
        }

        .alert-card.critical {
            border-left-color: var(--critical);
        }

        .alert-card.high {
            border-left-color: var(--high);
        }

        .alert-card.medium {
            border-left-color: var(--medium);
        }

        .alert-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .alert-id {
            color: var(--text-muted);
            font-family: monospace;
        }

        .alert-time {
            color: var(--text-muted);
        }

        .alert-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .alert-detail {
            font-size: 0.9rem;
            color: #D1D5DB;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .priority-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .bg-critical {
            background-color: var(--critical);
            color: white;
        }

        .bg-high {
            background-color: var(--high);
            color: white;
        }

        .bg-medium {
            background-color: var(--medium);
            color: black;
        }

        .tag-recuperada {
            color: #10B981;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
            border: 1px solid #10B981;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .tag-historial {
            color: #9CA3AF;
            font-size: 0.7rem;
            font-weight: bold;
            margin-left: 8px;
            border: 1px solid #9CA3AF;
            padding: 1px 4px;
            border-radius: 4px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-panel);
        }

        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">C5 <span>ALERT SYSTEM</span></div>
        <div class="status-badge" id="ws-status">
            <div class="pulse" id="ws-pulse"></div>
            <span id="ws-text">Conectando...</span>
        </div>
    </header>

    <main>
        <div id="map-container">
            <div id="map"></div>
        </div>

        <div id="feed">
            <div class="feed-header">🔴 Alertas Activas</div>
            <div id="alerts-list">
                <div style="text-align: center; color: var(--text-muted); margin-top: 2rem; font-size: 0.9rem;"
                    id="empty-state">
                    Esperando incidentes...
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Diccionario para guardar los pines del mapa y abrirlos al dar clic
        const pinesMapa = {};

        // 1. Inicializar el Mapa
        const map = L.map('map').setView([19.7136, -99.7613], 15);

        // 2. Definir todos los estilos de mapas
        const capaOscura = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 });
        const capaCalles = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] });
        const capaSatelite = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] });
        const capaHibrida = L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'] });

        capaHibrida.addTo(map);

        L.control.layers({
            "Híbrido (Satélite + Calles)": capaHibrida,
            "Satélite Puro": capaSatelite,
            "Google Maps (Calles)": capaCalles,
            "Modo Hacker (Oscuro)": capaOscura
        }).addTo(map);

        const icons = {
            critical: L.divIcon({ className: 'custom-icon', html: '<div style="background:#EF4444; width:20px; height:20px; border-radius:50%; border:3px solid #111827; box-shadow: 0 0 15px #EF4444;"></div>' }),
            high: L.divIcon({ className: 'custom-icon', html: '<div style="background:#F97316; width:20px; height:20px; border-radius:50%; border:3px solid #111827;"></div>' }),
            medium: L.divIcon({ className: 'custom-icon', html: '<div style="background:#EAB308; width:20px; height:20px; border-radius:50%; border:3px solid #111827;"></div>' })
        };

        const wsUrl = 'ws://localhost:3004';
        let ws;

        function connectWS() {
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                document.getElementById('ws-text').textContent = 'SISTEMA EN LÍNEA';
                document.getElementById('ws-text').style.color = '#10B981';
                document.getElementById('ws-pulse').style.backgroundColor = '#10B981';
                document.getElementById('ws-pulse').style.boxShadow = '0 0 10px #10B981';
                document.querySelector('.status-badge').style.borderColor = '#10B981';
                document.querySelector('.status-badge').style.background = 'rgba(16, 185, 129, 0.1)';
            };

            ws.onmessage = (event) => {
                const payload = JSON.parse(event.data);

                if (payload.type === 'alert') {
                    // Alerta normal en tiempo real
                    renderAlert(payload.data, 'realtime');
                } else if (payload.type === 'pending_alert') {
                    // Alertas que estaban trabadas en Redis (Tolerancia a fallos)
                    renderAlert(payload.data, 'pending');
                }
            };

            ws.onclose = () => {
                document.getElementById('ws-text').textContent = 'DESCONECTADO - REINTENTANDO';
                document.getElementById('ws-text').style.color = '#EF4444';
                document.getElementById('ws-pulse').style.backgroundColor = '#EF4444';
                document.getElementById('ws-pulse').style.boxShadow = '0 0 10px #EF4444';
                document.querySelector('.status-badge').style.borderColor = '#EF4444';
                document.querySelector('.status-badge').style.background = 'rgba(239, 68, 68, 0.1)';
                setTimeout(connectWS, 3000);
            };
        }

        // Renderizar la alerta: type puede ser 'realtime', 'pending', o 'history'
        function renderAlert(alert, type) {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.remove();

            const feed = document.getElementById('alerts-list');
            const timeFormatted = new Date(alert.timestamp).toLocaleTimeString('es-MX', { hour12: false });

            let priorityClass = 'medium';
            if (alert.priority === 'critical') priorityClass = 'critical';
            if (alert.priority === 'high') priorityClass = 'high';

            // Agregar la etiqueta visual si es recuperada o vieja
            let tagExtra = '';
            if (type === 'pending') tagExtra = '<span class="tag-recuperada">RECUPERADA</span>';
            if (type === 'history') tagExtra = '<span class="tag-historial">HISTORIAL</span>';

            const card = document.createElement('div');
            card.className = `alert-card ${priorityClass}`;
            card.innerHTML = `
                <div class="alert-top">
                    <span class="alert-id">${alert.device_id || 'UNKNOWN'} ${tagExtra}</span>
                    <span class="alert-time">${timeFormatted}</span>
                </div>
                <div class="alert-title">${alert.emergency_type.replace(/_/g, ' ')}</div>
                <div class="alert-detail">📍 ${alert.zone || 'Coordenadas: ' + alert.latitude.toFixed(4) + ', ' + alert.longitude.toFixed(4)}</div>
                <div class="priority-badge bg-${priorityClass}">${alert.priority_label || alert.priority}</div>
            `;

            feed.prepend(card);

            if (alert.latitude && alert.longitude) {
                // Crear el Pin en el mapa
                const marker = L.marker([alert.latitude, alert.longitude], {
                    icon: icons[priorityClass] || icons.medium
                }).addTo(map);

                marker.bindPopup(`<b>${alert.emergency_type.toUpperCase()}</b><br>${alert.zone}`);

                // Guardar el pin en nuestro diccionario usando el ID de la alerta
                const idUnico = alert.alert_id || Date.now().toString() + Math.random();
                pinesMapa[idUnico] = marker;

                // MAGIA: Al dar clic a la tarjeta, viaja al pin y abre la info
                card.onclick = () => {
                    map.flyTo([alert.latitude, alert.longitude], 18, { animate: true, duration: 1.5 });
                    pinesMapa[idUnico].openPopup();
                };

                // VUELO INTELIGENTE: Solo mueve la pantalla si es una alerta en Tiempo Real
                if (type === 'realtime') {
                    map.flyTo([alert.latitude, alert.longitude], 17, { animate: true, duration: 1 });
                    marker.openPopup();
                }
            }
        }

        async function cargarHistorial() {
            try {
                const respuesta = await fetch('http://localhost:3005/alerts?limit=10');
                const datos = await respuesta.json();

                if (datos.alerts && datos.alerts.length > 0) {
                    datos.alerts.reverse().forEach(alerta => {
                        if (alerta.priority === 'critical') alerta.priority_label = 'CRÍTICO';
                        if (alerta.priority === 'high') alerta.priority_label = 'ALTO';
                        if (alerta.priority === 'medium') alerta.priority_label = 'MEDIO';

                        renderAlert(alerta, 'history'); // Le decimos que es del historial
                    });
                }
            } catch (error) {
                console.error("Error al cargar el historial:", error);
            }
        }

        cargarHistorial();
        connectWS();
    </script>
</body>

</html>
