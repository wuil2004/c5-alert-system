<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C5 | Centro de Comando</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-base: #0B0F19;
            --bg-panel: #111827;
            --text-main: #E5E7EB;
            --text-muted: #9CA3AF;
            --accent: #3B82F6;
            --critical: #EF4444;
            --high: #F97316;
            --medium: #EAB308;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1F2937;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .logo { font-size: 1.5rem; font-weight: 900; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--accent); }

        .status-badge {
            background: rgba(16,185,129,0.1);
            color: #10B981;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            border: 1px solid #10B981;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse {
            width: 8px; height: 8px;
            background-color: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10B981;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        main { display: flex; flex: 1; height: calc(100vh - 70px); }

        #map-container { flex: 2; position: relative; border-right: 1px solid #1F2937; }
        #map { width: 100%; height: 100%; background-color: #1F2937; }

        #feed {
            flex: 1;
            min-width: 350px;
            max-width: 450px;
            background-color: var(--bg-panel);
            display: flex;
            flex-direction: column;
        }

        .feed-header {
            padding: 1rem;
            border-bottom: 1px solid #1F2937;
            font-weight: bold;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        #alerts-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .alert-card {
            background-color: #1F2937;
            border-radius: 8px;
            padding: 1rem;
            border-left: 5px solid gray;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease-out;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .alert-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.5); filter: brightness(1.2); }
        .alert-card.critical { border-left-color: var(--critical); }
        .alert-card.high     { border-left-color: var(--high); }
        .alert-card.medium   { border-left-color: var(--medium); }

        /* Estados de confirmación en la tarjeta */
        .alert-card.confirmed  { border-left-color: #10B981; opacity: 0.8; }
        .alert-card.false-alarm { border-left-color: #6B7280; opacity: 0.5; }

        .alert-top { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
        .alert-id  { color: var(--text-muted); font-family: monospace; }
        .alert-time { color: var(--text-muted); }
        .alert-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .alert-detail { font-size: 0.9rem; color: #D1D5DB; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }

        .priority-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 8px;
        }

        .bg-critical { background-color: var(--critical); color: white; }
        .bg-high     { background-color: var(--high); color: white; }
        .bg-medium   { background-color: var(--medium); color: black; }
        .bg-confirmed   { background-color: #10B981; color: white; }
        .bg-false-alarm { background-color: #6B7280; color: white; }

        .tag-recuperada { color: #10B981; font-size: 0.7rem; font-weight: bold; margin-left: 8px; border: 1px solid #10B981; padding: 1px 4px; border-radius: 4px; }
        .tag-historial  { color: #9CA3AF; font-size: 0.7rem; font-weight: bold; margin-left: 8px; border: 1px solid #9CA3AF; padding: 1px 4px; border-radius: 4px; }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-panel); }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        /* ══════════════════════════════════════════
           MODAL DE VERIFICACIÓN
        ══════════════════════════════════════════ */
        #modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #modal-overlay.active { display: flex; }

        #modal {
            background: #111827;
            border-radius: 12px;
            width: 90%;
            max-width: 820px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #1F2937;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            animation: modalIn 0.25s ease-out;
        }

        @keyframes modalIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        .modal-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid #1F2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 { font-size: 1.1rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
        }
        .modal-close:hover { color: white; background: #374151; }

        .modal-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; }

        /* Info de la alerta dentro del modal */
        .modal-alert-info {
            background: #1F2937;
            border-radius: 8px;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            font-size: 0.9rem;
        }

        .modal-alert-info .info-row { display: flex; flex-direction: column; gap: 2px; }
        .modal-alert-info .info-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .modal-alert-info .info-value { font-weight: bold; }

        /* Sección de cámara */
        .camera-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .cam-box {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #374151;
            position: relative;
        }

        .cam-label {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }

        .cam-box img,
        .cam-box video-stream { width: 100%; display: block; }

        /* El stream MJPEG va en un <img> */
        .cam-stream {
            width: 100%;
            min-height: 180px;
            object-fit: cover;
            display: block;
            background: #000;
        }

        .cam-error {
            min-height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            flex-direction: column;
            gap: 8px;
            padding: 1rem;
            text-align: center;
        }

        /* Foto capturada */
        #snapshot-img {
            width: 100%;
            min-height: 180px;
            object-fit: cover;
            display: block;
            border-radius: 0;
        }

        /* Botones de acción */
        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .btn-confirm, .btn-discard {
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-confirm  { background: #10B981; color: white; }
        .btn-discard  { background: #374151; color: #D1D5DB; }
        .btn-confirm:hover  { opacity: 0.9; transform: translateY(-1px); }
        .btn-discard:hover  { opacity: 0.9; transform: translateY(-1px); }
        .btn-confirm:disabled, .btn-discard:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* Resultado de la verificación */
        #modal-result {
            display: none;
            text-align: center;
            padding: 1rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
        #modal-result.confirmed  { background: rgba(16,185,129,0.15); color: #10B981; border: 1px solid #10B981; display: block; }
        #modal-result.false-alarm { background: rgba(107,114,128,0.15); color: #9CA3AF; border: 1px solid #6B7280; display: block; }

        /* Badge de estado en tarjeta */
        .status-tag {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            text-transform: uppercase;
        }
        .status-tag.confirmed   { background: rgba(16,185,129,0.2);  color: #10B981; border: 1px solid #10B981; }
        .status-tag.false-alarm { background: rgba(107,114,128,0.2); color: #9CA3AF; border: 1px solid #6B7280; }

        /* Alerta sonora visual */
        @keyframes flashBorder {
            0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
            50%      { box-shadow: 0 0 0 6px rgba(239,68,68,0.5); }
        }
        .alert-card.nueva { animation: slideIn 0.3s ease-out, flashBorder 1s ease-in-out 3; }
    </style>
</head>

<body>

    <header>
        <div class="logo">C5 <span>ALERT SYSTEM</span></div>
        <div class="status-badge" id="ws-status">
            <div class="pulse" id="ws-pulse"></div>
            <span id="ws-text">Conectando...</span>
        </div>
    </header>

    <main>
        <div id="map-container">
            <div id="map"></div>
        </div>

        <div id="feed">
            <div class="feed-header">🔴 Alertas Activas</div>
            <div id="alerts-list">
                <div style="text-align:center;color:var(--text-muted);margin-top:2rem;font-size:0.9rem;" id="empty-state">
                    Esperando incidentes...
                </div>
            </div>
        </div>
    </main>

    <!-- ══════════════════════════════════════════
         MODAL DE VERIFICACIÓN CON CÁMARA
    ══════════════════════════════════════════ -->
    <div id="modal-overlay">
        <div id="modal">
            <div class="modal-header">
                <h2 id="modal-title">🎥 Verificación de Alerta</h2>
                <button class="modal-close" onclick="cerrarModal()">✕</button>
            </div>
            <div class="modal-body">

                <!-- Info de la alerta -->
                <div class="modal-alert-info" id="modal-info">
                    <div class="info-row">
                        <span class="info-label">Dispositivo</span>
                        <span class="info-value" id="mi-device">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Tipo de Emergencia</span>
                        <span class="info-value" id="mi-type">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Zona</span>
                        <span class="info-value" id="mi-zone">—</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Prioridad</span>
                        <span class="info-value" id="mi-priority">—</span>
                    </div>
                </div>

                <!-- Video en vivo + Foto del momento -->
                <div class="camera-section">
                    <!-- Stream en vivo -->
                    <div class="cam-box">
                        <span class="cam-label">🔴 En vivo</span>
                        <img id="cam-live"
                             class="cam-stream"
                             src=""
                             alt="Stream"
                             onerror="this.style.display='none'; document.getElementById('cam-live-error').style.display='flex';" />
                        <div class="cam-error" id="cam-live-error" style="display:none;">
                            <span style="font-size:2rem;">📵</span>
                            <span>Cámara no disponible</span>
                            <span style="font-size:0.75rem;">Verifica que IP Webcam esté activo</span>
                        </div>
                    </div>

                    <!-- Foto capturada en el momento de la alerta -->
                    <div class="cam-box">
                        <span class="cam-label">📸 Foto del momento</span>
                        <img id="snapshot-img"
                             src=""
                             alt="Snapshot"
                             onerror="this.style.display='none'; document.getElementById('snap-error').style.display='flex';" />
                        <div class="cam-error" id="snap-error" style="display:none;">
                            <span style="font-size:2rem;">🖼️</span>
                            <span>No se pudo capturar foto</span>
                        </div>
                    </div>
                </div>

                <!-- Resultado (aparece después de confirmar/descartar) -->
                <div id="modal-result"></div>

                <!-- Botones de acción -->
                <div class="modal-actions" id="modal-btns">
                    <button class="btn-confirm" id="btn-confirm" onclick="verificarAlerta('confirmed')">
                        ✅ Confirmar Emergencia
                    </button>
                    <button class="btn-discard" id="btn-discard" onclick="verificarAlerta('false_alarm')">
                        ❌ Falsa Alarma
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>

        // ══ CONFIGURACIÓN ════════════════════════════════
        const CAM_URL  = 'http://192.168.2.23:8080';  // IP Webcam
        const WS_URL   = 'ws://localhost:3004';
        const API_URL  = 'http://localhost:3005';
        // ════════════════════════════════════════════════

        const pinesMapa = {};
        let alertaActualEnModal = null;  // alerta que está abierta en el modal
        let tarjetaActualEnModal = null; // referencia a la tarjeta del DOM

        // ── Mapa ─────────────────────────────────────────
        const map = L.map('map').setView([19.7136, -99.7613], 15);

        const capaOscura   = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 });
        const capaCalles   = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
        const capaSatelite = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });
        const capaHibrida  = L.tileLayer('http://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0','mt1','mt2','mt3'] });

        capaHibrida.addTo(map);
        L.control.layers({
            "Híbrido (Satélite + Calles)": capaHibrida,
            "Satélite Puro": capaSatelite,
            "Google Maps (Calles)": capaCalles,
            "Modo Hacker (Oscuro)": capaOscura
        }).addTo(map);

        const icons = {
            critical: L.divIcon({ className: 'custom-icon', html: '<div style="background:#EF4444;width:20px;height:20px;border-radius:50%;border:3px solid #111827;box-shadow:0 0 15px #EF4444;"></div>' }),
            high:     L.divIcon({ className: 'custom-icon', html: '<div style="background:#F97316;width:20px;height:20px;border-radius:50%;border:3px solid #111827;"></div>' }),
            medium:   L.divIcon({ className: 'custom-icon', html: '<div style="background:#EAB308;width:20px;height:20px;border-radius:50%;border:3px solid #111827;"></div>' })
        };

        // ── Modal ─────────────────────────────────────────
        function abrirModal(alert) {
            alertaActualEnModal = alert;

            // Rellenar info
            document.getElementById('mi-device').textContent   = alert.device_id || '—';
            document.getElementById('mi-type').textContent     = (alert.emergency_type || '—').replace(/_/g, ' ').toUpperCase();
            document.getElementById('mi-zone').textContent     = alert.zone || `${parseFloat(alert.latitude).toFixed(4)}, ${parseFloat(alert.longitude).toFixed(4)}`;
            document.getElementById('mi-priority').textContent = (alert.priority_label || alert.priority || '—').toUpperCase();

            // Resetear estado
            document.getElementById('modal-result').className = '';
            document.getElementById('modal-result').textContent = '';
            document.getElementById('modal-result').style.display = 'none';
            document.getElementById('btn-confirm').disabled = false;
            document.getElementById('btn-discard').disabled = false;
            document.getElementById('modal-btns').style.display = 'grid';

            // Cargar stream en vivo (MJPEG en un <img> — funciona en todos los browsers)
            const liveSrc = `${CAM_URL}/video`;
            const liveImg = document.getElementById('cam-live');
            liveImg.style.display = 'block';
            document.getElementById('cam-live-error').style.display = 'none';
            liveImg.src = liveSrc + '?t=' + Date.now();

            // Capturar foto del momento
            const snapSrc = `${CAM_URL}/shot.jpg`;
            const snapImg = document.getElementById('snapshot-img');
            snapImg.style.display = 'block';
            document.getElementById('snap-error').style.display = 'none';
            snapImg.src = snapSrc + '?t=' + Date.now();

            document.getElementById('modal-overlay').classList.add('active');
        }

        function cerrarModal() {
            // Detener el stream para no consumir ancho de banda
            document.getElementById('cam-live').src = '';
            document.getElementById('modal-overlay').classList.remove('active');
            alertaActualEnModal = null;
            tarjetaActualEnModal = null;
        }

        async function verificarAlerta(decision) {
            if (!alertaActualEnModal) return;

            const alertId = alertaActualEnModal.alert_id;

            // Deshabilitar botones
            document.getElementById('btn-confirm').disabled = true;
            document.getElementById('btn-discard').disabled = true;

            // Llamar al backend para guardar la decisión
            try {
                if (alertId) {
                    await fetch(`${API_URL}/alerts/${alertId}/status`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: decision })
                    });
                }
            } catch (e) {
                console.warn('No se pudo actualizar el status en backend:', e.message);
            }

            // Mostrar resultado en el modal
            const resultDiv = document.getElementById('modal-result');
            resultDiv.style.display = 'block';
            if (decision === 'confirmed') {
                resultDiv.className = 'confirmed';
                resultDiv.textContent = '✅ Emergencia confirmada — Unidades despachadas';
            } else {
                resultDiv.className = 'false-alarm';
                resultDiv.textContent = '❌ Marcada como falsa alarma';
            }

            // Actualizar la tarjeta en el feed
            if (tarjetaActualEnModal) {
                actualizarTarjeta(tarjetaActualEnModal, decision);
            }

            // Cerrar el modal después de 2 segundos
            setTimeout(cerrarModal, 2000);
        }

        function actualizarTarjeta(card, decision) {
            // Quitar clases de prioridad y poner la de estado
            card.classList.remove('critical', 'high', 'medium', 'nueva');
            card.classList.add(decision === 'confirmed' ? 'confirmed' : 'false-alarm');

            // Agregar badge de estado
            const idSpan = card.querySelector('.alert-id');
            const existingTag = idSpan.querySelector('.status-tag');
            if (existingTag) existingTag.remove();

            const tag = document.createElement('span');
            tag.className = `status-tag ${decision === 'confirmed' ? 'confirmed' : 'false-alarm'}`;
            tag.textContent = decision === 'confirmed' ? 'CONFIRMADA' : 'FALSA ALARMA';
            idSpan.appendChild(tag);

            // Cambiar el badge de prioridad
            const badge = card.querySelector('.priority-badge');
            if (badge) {
                badge.className = `priority-badge ${decision === 'confirmed' ? 'bg-confirmed' : 'bg-false-alarm'}`;
                badge.textContent = decision === 'confirmed' ? '✅ DESPACHADA' : '❌ FALSA ALARMA';
            }
        }

        // Cerrar modal al hacer clic fuera
        document.getElementById('modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) cerrarModal();
        });

        // ── Renderizar alertas ────────────────────────────
        function renderAlert(alert, type) {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.remove();

            const feed = document.getElementById('alerts-list');
            const timeFormatted = new Date(alert.timestamp).toLocaleTimeString('es-MX', { hour12: false });

            let priorityClass = 'medium';
            if (alert.priority === 'critical') priorityClass = 'critical';
            if (alert.priority === 'high')     priorityClass = 'high';

            let tagExtra = '';
            if (type === 'pending') tagExtra = '<span class="tag-recuperada">RECUPERADA</span>';
            if (type === 'history') tagExtra = '<span class="tag-historial">HISTORIAL</span>';

            const card = document.createElement('div');
            card.className = `alert-card ${priorityClass}${type === 'realtime' ? ' nueva' : ''}`;

            card.innerHTML = `
                <div class="alert-top">
                    <span class="alert-id">${alert.device_id || 'UNKNOWN'} ${tagExtra}</span>
                    <span class="alert-time">${timeFormatted}</span>
                </div>
                <div class="alert-title">${(alert.emergency_type || '').replace(/_/g, ' ')}</div>
                <div class="alert-detail">📍 ${alert.zone || 'Coords: ' + parseFloat(alert.latitude).toFixed(4) + ', ' + parseFloat(alert.longitude).toFixed(4)}</div>
                <div class="priority-badge bg-${priorityClass}">${alert.priority_label || alert.priority}</div>
            `;

            // Solo alertas en tiempo real abren el modal automáticamente
            if (type === 'realtime') {
                // Abrir modal automáticamente
                tarjetaActualEnModal = card;
                setTimeout(() => abrirModal(alert), 300);
            }

            // Clic en tarjeta → abrir modal de verificación
            card.onclick = () => {
                tarjetaActualEnModal = card;
                abrirModal(alert);
            };

            feed.prepend(card);

            // Pin en el mapa
            if (alert.latitude && alert.longitude) {
                const marker = L.marker([alert.latitude, alert.longitude], {
                    icon: icons[priorityClass] || icons.medium
                }).addTo(map);

                marker.bindPopup(`<b>${(alert.emergency_type || '').toUpperCase()}</b><br>${alert.zone || ''}`);

                const idUnico = alert.alert_id || Date.now().toString() + Math.random();
                pinesMapa[idUnico] = marker;

                card.onclick = () => {
                    map.flyTo([alert.latitude, alert.longitude], 18, { animate: true, duration: 1.5 });
                    pinesMapa[idUnico].openPopup();
                    tarjetaActualEnModal = card;
                    abrirModal(alert);
                };

                if (type === 'realtime') {
                    map.flyTo([alert.latitude, alert.longitude], 17, { animate: true, duration: 1 });
                    marker.openPopup();
                }
            }
        }

        // ── WebSocket ─────────────────────────────────────
        let ws;
        function connectWS() {
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                document.getElementById('ws-text').textContent = 'SISTEMA EN LÍNEA';
                document.getElementById('ws-text').style.color = '#10B981';
                document.getElementById('ws-pulse').style.backgroundColor = '#10B981';
                document.getElementById('ws-pulse').style.boxShadow = '0 0 10px #10B981';
                document.querySelector('.status-badge').style.borderColor = '#10B981';
                document.querySelector('.status-badge').style.background = 'rgba(16,185,129,0.1)';
            };

            ws.onmessage = (event) => {
                const payload = JSON.parse(event.data);
                if (payload.type === 'alert')         renderAlert(payload.data, 'realtime');
                else if (payload.type === 'pending_alert') renderAlert(payload.data, 'pending');
            };

            ws.onclose = () => {
                document.getElementById('ws-text').textContent = 'DESCONECTADO - REINTENTANDO';
                document.getElementById('ws-text').style.color = '#EF4444';
                document.getElementById('ws-pulse').style.backgroundColor = '#EF4444';
                document.getElementById('ws-pulse').style.boxShadow = '0 0 10px #EF4444';
                document.querySelector('.status-badge').style.borderColor = '#EF4444';
                document.querySelector('.status-badge').style.background = 'rgba(239,68,68,0.1)';
                setTimeout(connectWS, 3000);
            };
        }

        // ── Historial ─────────────────────────────────────
        async function cargarHistorial() {
            try {
                const respuesta = await fetch(`${API_URL}/alerts?limit=10`);
                const datos = await respuesta.json();
                if (datos.alerts && datos.alerts.length > 0) {
                    datos.alerts.reverse().forEach(alerta => {
                        if (alerta.priority === 'critical') alerta.priority_label = 'CRÍTICO';
                        if (alerta.priority === 'high')     alerta.priority_label = 'ALTO';
                        if (alerta.priority === 'medium')   alerta.priority_label = 'MEDIO';
                        renderAlert(alerta, 'history');
                    });
                }
            } catch (error) {
                console.error('Error al cargar el historial:', error);
            }
        }

        cargarHistorial();
        connectWS();
    </script>
</body>
</html>
